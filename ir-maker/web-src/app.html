<title>IR Maker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow column of work — composer on top, drafts as forms, a fixed action bar at the bottom. */
:root{
  --paper:#f6f7f9; --sheet:#ffffff; --ink:#1b2333; --muted:#5d6678; --line:#d9dde5;
  --stamp:#2f3f9e; --stamp-soft:#e7eafb; --amber:#a35a00; --amber-soft:#fff3df;
  --ok:#1f7a4d; --ok-soft:#e2f4ea; --bad:#b3261e; --bad-soft:#fde8e6;
  --f-body:"Noto Sans Arabic","Segoe UI",Tahoma,"Dubai",system-ui,sans-serif;
  --f-mono:ui-monospace,"Roboto Mono","Consolas",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12151c; --sheet:#1a1f29; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2c3341;
  --stamp:#8fa0ff; --stamp-soft:#232a4a; --amber:#ffb84d; --amber-soft:#3a2c14;
  --ok:#5fd394; --ok-soft:#173326; --bad:#ff8a80; --bad-soft:#3b1b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12151c; --sheet:#1a1f29; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2c3341;
  --stamp:#8fa0ff; --stamp-soft:#232a4a; --amber:#ffb84d; --amber-soft:#3a2c14;
  --ok:#5fd394; --ok-soft:#173326; --bad:#ff8a80; --bad-soft:#3b1b19; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.credit{padding-top:10px;text-align:center;font-size:12px;letter-spacing:.04em;color:var(--stamp);font-weight:600;direction:ltr}
header{padding-block:4px 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.counter{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1.5px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:6px 10px;transform:rotate(-2deg)}
.counter b{font-family:var(--f-mono);font-size:15px;direction:ltr}
.counter span{font-size:11px;letter-spacing:.02em}
section{display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
textarea,input,select{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--stamp);outline-offset:1px}
#req{min-height:84px;resize:vertical;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--stamp)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent;padding:10px 16px}
.primary{background:var(--stamp);color:#fff;font-weight:700}
:root[data-theme="dark"] .primary{color:#10142a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary{color:#10142a}}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.danger{background:transparent;color:var(--bad);border-color:transparent;padding:6px 8px}
.notice{border-radius:8px;padding:10px 12px;font-size:14px}
.warn{background:var(--amber-soft);color:var(--amber)}
.good{background:var(--ok-soft);color:var(--ok)}
.err{background:var(--bad-soft);color:var(--bad)}
.ir{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ir-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px dashed var(--line)}
.ir-no{font-family:var(--f-mono);direction:ltr;font-weight:700;color:var(--stamp);font-size:14px}
.ir-body{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ir-body .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.ir-body textarea{min-height:64px;font-size:15px}
.loc{font-size:13px;color:var(--muted)}
.bar{position:fixed;inset:auto 0 0 0;background:var(--sheet);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .primary{flex:1;padding:13px}
details{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
summary{cursor:pointer;padding:12px 0;font-weight:600}
details .inner{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .d{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;border-radius:999px;padding:2px 8px;font-weight:700;font-family:var(--f-mono)}
.pill.W{background:var(--amber-soft);color:var(--amber)}
.pill.A,.pill.B{background:var(--ok-soft);color:var(--ok)}
.pill.C{background:var(--bad-soft);color:var(--bad)}
.setup{background:var(--sheet);border:1.5px dashed var(--stamp);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.file-btn{position:relative;overflow:hidden;display:inline-block}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.small{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="credit">Developed by Eng. Ahmed Rabie</div>
  <header>
    <div>
      <h1>طلبات الفحص — U-Section</h1>
      <div class="sub" id="sub">قطاع القناة المستطيل · St 8+500 → 9+500</div>
    </div>
    <div class="counter" id="counter" hidden><span>آخر IR في اللوج</span><b id="lastIr">—</b></div>
  </header>

  <div id="setup" class="setup" hidden>
    <strong>ارفع ملف الـ IR Log</strong>
    <div class="small">البرنامج بيقرأ اللوج مرة واحدة ويحفظه جوّه التليفون. بعد كده كل IR جديد بيتضاف عليه تلقائي.</div>
    <label class="file-btn primary"><span>اختار ملف Excel</span><input id="logFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label>
  </div>

  <div id="main" style="display:none">
    <section>
      <label class="label" for="req">اكتب المطلوب</label>
      <textarea id="req" placeholder="مثلاً: حدادة ونجارة حائط بحري فاصل 20"></textarea>
      <div class="chips" id="examples"></div>
      <div class="row">
        <div class="field" style="flex:1"><label for="date">تاريخ طلب الفحص</label><input id="date" type="date"></div>
        <button class="primary" id="go" style="align-self:flex-end">جهّز الـ IR</button>
      </div>
    </section>

    <div id="msgs" class="list" style="gap:8px"></div>
    <section id="drafts"></section>
    <div id="alts" class="chips"></div>
    <div id="done"></div>

    <details id="tools">
      <summary>أدوات اللوج</summary>
      <div class="inner">
        <div class="field"><label for="reNo">طباعة IR قديم أو إعادة تقديمه (رقم الـ IR)</label>
          <div class="row"><input id="reNo" class="mono" inputmode="numeric" placeholder="558" style="flex:1"><button class="ghost" id="rePrint">طباعة</button><button class="ghost" id="reSubmit">إعادة تقديم (Rev جديد)</button></div>
        </div>
        <div class="row">
          <button class="ghost" id="exportLog">حفظ نسخة من اللوج</button>
          <button class="ghost" id="undo">تراجع عن آخر تسجيل</button>
        </div>
        <div class="row">
          <label class="file-btn ghost"><span>تغيير ملف اللوج</span><input id="logFile2" type="file" accept=".xlsx"></label>
          <label class="file-btn ghost"><span>تغيير فورم الـ Word</span><input id="tplFile" type="file" accept=".docx"></label>
        </div>
        <div id="confirmBox"></div>
        <div class="small" id="info"></div>
      </div>
    </details>

    <section>
      <div class="label">آخر الطلبات في اللوج</div>
      <div class="list" id="recent" style="background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:0 12px"></div>
    </section>
  </div>
</div>

<div class="bar" id="bar" hidden><div class="in">
  <button class="primary" id="save">سجّل في اللوج واطبع</button>
  <button class="ghost" id="clear">مسح</button>
</div></div>

<script>/*__ENGINE__*/</script>
<script>
var TEMPLATE_B64 = "/*__TEMPLATE__*/";
(function(){
'use strict';
var E = window.IREngine, $ = function(id){return document.getElementById(id);};
var S = { log:null, logBytes:null, logName:'IR Log - U-Section.xlsx', tpl:null, drafts:[], lastFiles:null };
var BR = window.AndroidBridge || null;

// ---------- storage (IndexedDB) ----------
var dbp = null;
function db(){ if(dbp) return dbp; dbp = new Promise(function(res,rej){ try{ var r = indexedDB.open('irmaker',1); r.onupgradeneeded=function(){ r.result.createObjectStore('kv'); }; r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }catch(e){rej(e);} }); return dbp; }
function put(k,v){ return db().then(function(d){ return new Promise(function(res,rej){ var t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=function(){rej(t.error);}; }); }).catch(function(){}); }
function get(k){ return db().then(function(d){ return new Promise(function(res){ var t=d.transaction('kv','readonly'); var q=t.objectStore('kv').get(k); q.onsuccess=function(){res(q.result);}; q.onerror=function(){res(undefined);}; }); }).catch(function(){ return undefined; }); }

function b64ToBytes(b){ var s=atob(b), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function bytesToB64(u){ var s='', C=0x8000; for(var i=0;i<u.length;i+=C) s+=String.fromCharCode.apply(null,u.subarray(i,i+C)); return btoa(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoToDate(s){ var p=(s||todayISO()).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }

var DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document', XLSX='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
function deliver(name, bytes, mime, open){
  if (BR && BR.saveFile) { try { return BR.saveFile(name, bytesToB64(bytes), mime, !!open); } catch(e) { msg('err','ما قدرتش أحفظ الملف: '+e.message); return null; } }
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([bytes],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},4000); return name;
}

function msg(kind, text, keep){ var box=$('msgs'); if(!keep) box.innerHTML=''; var d=document.createElement('div'); d.className='notice '+kind; d.textContent=text; box.appendChild(d); }

// ---------- load ----------
async function useLog(bytes, name, persist){
  var log = await E.loadLog(bytes);
  S.log = log; S.logBytes = bytes; if(name) S.logName = name;
  if (persist){ await put('log', {bytes:bytes, name:S.logName}); }
  render();
}
async function init(){
  $('date').value = todayISO();
  var t = await get('tpl'); S.tpl = t ? t : b64ToBytes(TEMPLATE_B64);
  var saved = await get('log');
  if (saved && saved.bytes) { try { await useLog(saved.bytes, saved.name, false); return; } catch(e){ msg('err','الملف المحفوظ فيه مشكلة، ارفعه تاني.'); } }
  render();
}

function render(){
  var has = !!S.log;
  $('setup').hidden = has; $('main').hidden = !has; $('counter').hidden = !has; $('bar').hidden = !has || !S.drafts.length;
  $('main').style.display = has ? 'contents' : 'none';
  if (!has) return;
  var L=S.log;
  $('lastIr').textContent = String(L.lastNum);
  $('sub').textContent = L.rows.length+' طلب في اللوج · '+Object.keys(L.blocks).length+' فاصل';
  var ex=['حدادة حائط بحري فاصل 20','نجارة حائط قبلي فاصل 11 منسوب 3.207','حدادة لبشة رقة سفلية فاصل 21','صب لبشة فاصل 21','هونش فاصل 4 منسوب -2.43','خوازيق فاصل 22 P54 P61 P112'];
  $('examples').innerHTML = ex.map(function(x){return '<button class="chip" data-ex="'+esc(x)+'">'+esc(x)+'</button>';}).join('');
  renderRecent(); renderDrafts();
  $('info').textContent = 'اللوج: '+S.logName+' · الفورم: '+(S.tpl===null?'—':'جاهز');
}

function renderRecent(){
  var rows = S.log.rows.slice(-8).reverse();
  $('recent').innerHTML = rows.map(function(r){
    var a = String(r.action||'').trim().toUpperCase();
    return '<div class="li"><span class="mono" style="font-size:13px;font-weight:700">'+E.irNum(r.ir)+(+r.rev?'<small>-R'+r.rev+'</small>':'')+'</span><span class="d" title="'+esc(r.desc)+'">'+esc(r.desc.replace(/\s+/g,' '))+'</span><span class="row" style="gap:6px"><span class="pill '+esc(a)+'">'+esc(a||'—')+'</span><button class="ghost" style="padding:4px 10px;font-size:12px" data-reprint="'+esc(r.ir)+'|'+r.rev+'">طباعة</button></span></div>';
  }).join('');
}

function blockOptions(sel){
  return '<option value="">—</option>'+Object.keys(S.log.blocks).map(Number).sort(function(a,b){return a-b;}).map(function(n){return '<option value="'+n+'"'+(n===sel?' selected':'')+'>فاصل '+n+'</option>';}).join('');
}
function renderDrafts(){
  var nums = E.nextIrNumbers(S.log, S.drafts.length);
  $('drafts').innerHTML = S.drafts.map(function(d,i){
    var B=S.log.blocks[d.block];
    return '<article class="ir" data-i="'+i+'">'+
      '<div class="ir-head"><span class="ir-no">'+esc(E.formIrNo(S.log,nums[i].n,0))+'</span><button class="danger" data-del="'+i+'" aria-label="احذف">حذف ✕</button></div>'+
      '<div class="ir-body">'+
        '<div class="field full"><label for="d-desc-'+i+'">الأعمال المطلوب فحصها</label><textarea id="d-desc-'+i+'" data-k="desc">'+esc(d.desc)+'</textarea></div>'+
        '<div class="field"><label for="d-block-'+i+'">الفاصل</label><select id="d-block-'+i+'" data-k="block">'+blockOptions(d.block)+'</select></div>'+
        '<div class="field"><label for="d-unit-'+i+'">Unit</label><select id="d-unit-'+i+'" data-k="unit">'+['Civil','Survey','Survey+Civil'].map(function(u){return '<option'+(u===d.unit?' selected':'')+'>'+u+'</option>';}).join('')+'</select></div>'+
        '<div class="field"><label for="d-item-'+i+'">Item (اللوج)</label><input id="d-item-'+i+'" data-k="item" value="'+esc(d.item)+'"></div>'+
        '<div class="field"><label for="d-sub-'+i+'">Sub-Item</label><input id="d-sub-'+i+'" data-k="subItem" value="'+esc(d.subItem)+'"></div>'+
        '<div class="field full"><label for="d-fi-'+i+'">نوع العنصر (على الفورم)</label><input id="d-fi-'+i+'" data-k="formItem" value="'+esc(d.formItem)+'"></div>'+
        '<div class="loc full">📍 '+esc(B?E.formLocation(B):'اختار الفاصل')+'</div>'+
      '</div></article>';
  }).join('');
  $('bar').hidden = !S.drafts.length;
  $('save').textContent = S.drafts.length>1 ? 'سجّل '+S.drafts.length+' طلبات في اللوج واطبع' : 'سجّل في اللوج واطبع';
}

// ---------- actions ----------
function understand(){
  var text=$('req').value.trim(); if(!text){ msg('warn','اكتب المطلوب الأول، مثلاً: حدادة حائط بحري فاصل 20'); return; }
  var u = E.understand(S.log, text, isoToDate($('date').value));
  $('msgs').innerHTML='';
  if (!u.drafts.length) msg('warn','ما فهمتش نوع الشغل. جرّب تكتبه زي ما بيتكتب في اللوج، أو اختار من الاقتراحات تحت.');
  u.warnings.forEach(function(w){ msg('warn', w, true); });
  S.drafts = S.drafts.concat(u.drafts);
  if (u.rule) u.alternatives = [];
  S.alts = u.alternatives;
  $('alts').innerHTML = (u.alternatives.length? '<span class="small" style="width:100%">صيغ مشابهة من اللوج:</span>':'') + u.alternatives.map(function(r,i){ return '<button class="chip" data-alt="'+i+'">'+esc(r.desc.replace(/\s+/g,' ').slice(0,70))+'</button>'; }).join('');
  $('done').innerHTML='';
  renderDrafts();
}

async function save(){
  if (!S.drafts.length) return;
  var bad = S.drafts.filter(function(d){ return d.block==null || d.block==='' || /…/.test(d.desc); });
  if (bad.length){ msg('err','فيه طلب ناقص (الفاصل أو قيمة مكتوب مكانها …). كمّله الأول.'); return; }
  $('save').disabled = true;
  try{
    var date = isoToDate($('date').value);
    S.drafts.forEach(function(d){ d.date = date; });
    var recs = E.finalize(S.log, S.drafts);
    var prev = S.logBytes;
    await E.appendRows(S.log, recs);
    var bytes = await E.saveLog(S.log);
    await put('logPrev', {bytes:prev, name:S.logName, undoOf: recs.map(function(r){return r.ir;})});
    await useLog(bytes, S.logName, true);
    var form = await E.buildForm(S.tpl, recs);
    var fname = recs.length===1 ? recs[0].formIr+'.docx' : 'IR '+recs[0].n+'-'+recs[recs.length-1].n+'.docx';
    S.lastFiles = {form:form, fname:fname};
    deliver(S.logName, bytes, XLSX, false);
    deliver(fname, form, DOCX, true);
    S.drafts=[]; $('req').value=''; $('alts').innerHTML=''; $('msgs').innerHTML='';
    $('done').innerHTML = '<div class="notice good">اتسجّل '+(recs.length===1?'IR رقم ':'من ')+'<span class="mono">'+recs[0].n+(recs.length>1?' → '+recs[recs.length-1].n:'')+'</span> في اللوج، والفورم جاهز للطباعة.'+
      '<div class="row" style="margin-top:8px"><button class="ghost" id="reopen">افتح الفورم تاني</button></div></div>';
    renderDrafts();
  } catch(e){ msg('err','حصلت مشكلة أثناء التسجيل: '+e.message); }
  $('save').disabled = false;
}

function findRows(no){
  var n = parseInt(String(no).replace(/[^\d]/g,''),10); if(!n) return [];
  return S.log.rows.filter(function(r){ return E.irNum(r.ir)===n; });
}
async function reprint(irStr, rev){
  var rows = S.log.rows.filter(function(r){ return r.ir===irStr && String(r.rev)===String(rev); });
  var r = rows[rows.length-1] || S.log.rows.filter(function(x){return x.ir===irStr;}).pop();
  if(!r){ msg('err','الرقم ده مش موجود في اللوج'); return; }
  var form = await E.buildForm(S.tpl, rows.length>1 ? rows.map(function(x){return E.recordFromRow(S.log,x);}) : [E.recordFromRow(S.log, r)]);
  deliver(E.formIrNo(S.log,E.irNum(r.ir),r.rev)+'.docx', form, DOCX, true);
}
async function resubmit(no){
  var rows = findRows(no); if(!rows.length){ msg('err','الرقم ده مش موجود في اللوج'); return; }
  var last = rows[rows.length-1], rev = Math.max.apply(null, rows.map(function(r){return +r.rev||0;})) + 1;
  var B = S.log.blocks[E.blockNum(last.block)];
  var rec = { n:E.irNum(last.ir), ir:last.ir, rev:rev, sub:'L', unit:last.unit, blockLabel:last.block, loc:last.loc, from:last.from, to:last.to, desc:last.desc, item:last.item, subItem:last.subItem,
    date:isoToDate($('date').value), formIr:E.formIrNo(S.log,E.irNum(last.ir),rev), formItem:last.item, formLoc:B?E.formLocation(B):String(last.loc||'').replace(/\s+/g,' '), attempt:Math.min(rev+1,3), action:'W', status:'WAITING' };
  var prev = S.logBytes;
  await E.appendRows(S.log, [rec]);
  var bytes = await E.saveLog(S.log);
  await put('logPrev', {bytes:prev, name:S.logName});
  await useLog(bytes, S.logName, true);
  deliver(S.logName, bytes, XLSX, false);
  deliver(rec.formIr+'.docx', await E.buildForm(S.tpl,[rec]), DOCX, true);
  msg('good','اتسجّل '+rec.formIr+' (المرة رقم '+(rev+1)+') في اللوج.');
}

// ---------- events ----------
document.addEventListener('click', function(ev){
  var t = ev.target.closest('button'); if(!t) return;
  if (t.dataset.ex){ $('req').value = t.dataset.ex; $('req').focus(); return; }
  if (t.dataset.del!=null){ S.drafts.splice(+t.dataset.del,1); renderDrafts(); return; }
  if (t.dataset.alt!=null){ var r=S.alts[+t.dataset.alt]; var b = S.drafts.length? S.drafts[S.drafts.length-1].block : E.blockNum(r.block);
    S.drafts.push({desc:r.desc, item:r.item||'', subItem:r.subItem||'', unit:r.unit||'Civil', block:b, rev:0, formItem:r.item||'', date:isoToDate($('date').value)}); renderDrafts(); return; }
  if (t.dataset.reprint){ var p=t.dataset.reprint.split('|'); reprint(p[0],p[1]); return; }
  if (t.id==='go') understand();
  if (t.id==='save') save();
  if (t.id==='clear'){ S.drafts=[]; $('alts').innerHTML=''; $('msgs').innerHTML=''; renderDrafts(); }
  if (t.id==='reopen' && S.lastFiles) deliver(S.lastFiles.fname, S.lastFiles.form, DOCX, true);
  if (t.id==='exportLog') { deliver(S.logName, S.logBytes, XLSX, false); msg('good','اتحفظت نسخة من اللوج: '+S.logName); }
  if (t.id==='rePrint'){ var rows=findRows($('reNo').value); if(!rows.length) msg('err','الرقم ده مش موجود في اللوج'); else { var r2=rows[rows.length-1]; reprint(r2.ir, r2.rev); } }
  if (t.id==='reSubmit'){ var no=$('reNo').value; if(!findRows(no).length){ msg('err','الرقم ده مش موجود في اللوج'); return; }
    $('confirmBox').innerHTML='<div class="notice warn">هيتضاف سطر جديد بنفس رقم '+esc(no)+' و Rev أعلى. متأكد؟ <button class="ghost" id="yesRe">أيوه سجّل</button> <button class="ghost" id="noRe">لأ</button></div>'; }
  if (t.id==='yesRe'){ $('confirmBox').innerHTML=''; resubmit($('reNo').value); }
  if (t.id==='noRe'){ $('confirmBox').innerHTML=''; }
  if (t.id==='undo'){ $('confirmBox').innerHTML='<div class="notice warn">هيرجع اللوج زي ما كان قبل آخر تسجيل. متأكد؟ <button class="ghost" id="yesUndo">أيوه</button> <button class="ghost" id="noRe">لأ</button></div>'; }
  if (t.id==='yesUndo'){ $('confirmBox').innerHTML=''; get('logPrev').then(function(p){ if(!p||!p.bytes){ msg('warn','مفيش تسجيل أتراجع عنه.'); return; }
      return useLog(p.bytes, p.name, true).then(function(){ put('logPrev', null); deliver(S.logName, S.logBytes, XLSX, false); msg('good','رجعت اللوج لآخر IR رقم '+S.log.lastNum+'.'); }); }); }
});
document.addEventListener('input', function(ev){
  var el=ev.target, card=el.closest('.ir'); if(!card||!el.dataset.k) return;
  var d=S.drafts[+card.dataset.i]; var k=el.dataset.k;
  d[k] = k==='block' ? (el.value===''?null:+el.value) : el.value;
  if (k==='block') renderDrafts();
});
document.addEventListener('change', function(ev){ if(ev.target.dataset && ev.target.dataset.k==='block') return; });
$('req').addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); understand(); } });

function readFile(input, cb){ var f=input.files&&input.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ cb(new Uint8Array(r.result), f.name); input.value=''; }; r.readAsArrayBuffer(f); }
['logFile','logFile2'].forEach(function(id){ $(id).addEventListener('change', function(){ readFile(this, function(b,n){ useLog(b,n,true).then(function(){ msg('good','اتقرا اللوج: '+S.log.rows.length+' طلب، آخر IR رقم '+S.log.lastNum); }).catch(function(e){ msg('err','الملف ده مش لوج IR مفهوم: '+e.message); render(); }); }); }); });
$('tplFile').addEventListener('change', function(){ readFile(this, function(b){ S.tpl=b; put('tpl', b); msg('good','اتغيّر فورم الـ Word.'); render(); }); });

init();
})();
</script>
