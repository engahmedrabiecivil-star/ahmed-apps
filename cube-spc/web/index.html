<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Concrete SPC</title>
<link rel="icon" href="icon-192.png">
<style>
/* Layout: one working column; settings card on top, report sections stacked below like a printed QC report */
:root{
  --bg:#eef1f0; --surface:#ffffff; --fg:#1b2422; --muted:#5b6865; --line:#d3dad8; --soft:#f5f8f7;
  --accent:#1f6b4a; --accent-soft:#e2f0e8; --band:#2f7d33; --band-fg:#ffffff; --hl:#fff6c4;
  --ok:#23784a; --ok-soft:#dff2e6; --warn:#9a6400; --warn-soft:#fbefd4; --bad:#b3261e; --bad-soft:#fbe3e1; --na:#5b6865; --na-soft:#eceff0;
  --c-line:#24302d; --c-ucl:#cc2b2b; --c-cl:#2e8b3e; --c-bar:#6f93cf; --c-curve:#b3261e; --c-grid:#e6ebea;
  --ui:"Segoe UI",Roboto,"Helvetica Neue",Tahoma,Arial,sans-serif;
  --num:"Segoe UI",Roboto,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--ui);-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;letter-spacing:.2px}
header.top .sub{color:var(--muted);font-size:12px}
header.top .sp{flex:1}
nav.tabs{display:flex;gap:4px}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;font:600 14px var(--ui);color:var(--muted);cursor:pointer}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
main{max-width:1060px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:12px 0 6px}
.muted{color:var(--muted)}
.small{font-size:12px}
button,select,input{font:inherit;color:inherit}
button.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn:focus-visible,select:focus-visible,input:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=number],input[type=text],input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:40px;max-width:100%;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f>span{font-weight:600}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;background:var(--soft)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.map{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 12px;align-items:center;margin:10px 0}
.map .req::after{content:" *";color:var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--soft);font-size:12px;color:var(--muted);position:sticky;top:0}
td.n,th.n{text-align:right}
tr.out td{color:var(--muted);text-decoration:line-through}
tr.flag td{background:var(--warn-soft)}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{background:var(--ok-soft);color:var(--ok)} .warn{background:var(--warn-soft);color:var(--warn)} .bad{background:var(--bad-soft);color:var(--bad)} .na{background:var(--na-soft);color:var(--na)}
.groups{display:flex;gap:6px;flex-wrap:wrap}
.groups button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.groups button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw}

/* ---------- report ---------- */
.rep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.rhead{text-align:center;display:flex;flex-direction:column;gap:4px}
.rhead .proj{font-size:22px;font-weight:800;color:#1f4d3a;margin:0}
.rhead .b1{background:#a9d18e;border:1.5px solid #222;font-weight:800;padding:4px 8px;color:#111}
.rhead .b2{background:#fff2a8;border:1.5px solid #222;padding:3px 8px;font-size:13px;color:#111}
section.sec{display:flex;flex-direction:column;gap:8px;break-inside:avoid;page-break-inside:avoid}
section.sec>h2{border-bottom:2px solid var(--accent);padding-bottom:4px;color:var(--accent);margin:0}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.chart{min-width:0}
.chart svg{width:100%;height:auto;display:block}
.chart .t{font-weight:700;text-align:center;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft)}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--muted)}
.banner{background:var(--band);color:var(--band-fg);text-align:center;font-weight:800;padding:9px 12px;border-radius:4px;font-size:15px}
.banner.b-warn{background:#b7791f}.banner.b-bad{background:#b3261e}.banner.b-na{background:#6b7774}
.insuf{border:1px dashed var(--line);border-radius:8px;padding:12px;background:var(--na-soft);color:var(--na)}
.insuf b{color:var(--fg)}
.ecp td,.ecp th{text-align:center;border:1px solid #333;white-space:normal}
.ecp th{background:#fff;color:var(--fg);position:static}
.ecp td.hit{background:var(--hl);font-weight:800;outline:3px solid #d32f2f;outline-offset:-3px}
.ecp .ar{direction:rtl;display:block;font-size:12px;color:var(--muted)}
.big{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.dash td:first-child{font-weight:600}
.qa{display:grid;gap:8px}
.qa div{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.qa div b{flex:1}
.foot{font-size:11px;color:var(--muted);font-style:italic}
.viol li{margin:2px 0}
.bar{height:10px;border-radius:3px;background:var(--c-bar)}

@media (max-width:560px){.map{grid-template-columns:1fr}.big{font-size:32px}.rep{padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff;font-size:11px}
  header.top,.noprint,nav.tabs,.toast{display:none!important}
  main{padding:0;max-width:none}
  .rep{border:0;padding:0}
  section.sec{page-break-inside:avoid}
  .pb{page-break-before:always}
}
</style>

<body>
<header class="top">
  <div><h1>Concrete SPC</h1><div class="sub" id="hdrSub">28-day cube strength analysis · ECP 203-2020</div></div>
  <span class="sp"></span>
  <nav class="tabs" id="tabs"><button data-t="reg">Register</button><button data-t="rep">Report</button></nav>
</header>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>
<input type="file" id="file" accept=".xlsx,.xlsm,.csv" hidden>
<script src="jszip.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='concrete-spc-v1';
const NATIVE=!!window.AndroidBridge;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}

/* ================= statistics ================= */
const ST={
  mean:a=>a.reduce((s,x)=>s+x,0)/a.length,
  sd(a){if(a.length<2)return NaN;const m=ST.mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))},
  median(a){const b=[...a].sort((x,y)=>x-y),n=b.length;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2},
};
function erfc(x){const z=Math.abs(x),t=1/(1+0.5*z);
  const r=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(0.37409196+t*(0.09678418+t*(-0.18628806+t*(0.27886807+t*(-1.13520398+t*(1.48851587+t*(-0.82215223+t*0.17087277)))))))));
  return x>=0?r:2-r}
const Phi=z=>0.5*erfc(-z/Math.SQRT2);
function invPhi(p){ // Acklam
  if(p<=0)return -Infinity;if(p>=1)return Infinity;
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
  b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
  c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
  d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416],pl=0.02425;let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)}
function lnGamma(x){const g=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(const c of g)s+=c/++y;return -t+Math.log(2.5066282746310005*s/x)}
function betacf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;
  for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-12)break}return h}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lnGamma(a+b)-lnGamma(a)-lnGamma(b)+a*Math.log(x)+b*Math.log(1-x));
  return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
const tTwoSided=(t,df)=>ibeta(df/(df+t*t),df/2,0.5);
const fCdf=(f,d1,d2)=>ibeta(d1*f/(d1*f+d2),d1/2,d2/2);
function andersonDarling(a){const n=a.length;if(n<8)return null;const m=ST.mean(a),s=ST.sd(a);const z=[...a].sort((x,y)=>x-y).map(x=>Math.min(Math.max(Phi((x-m)/s),1e-12),1-1e-12));
  let S=0;for(let i=0;i<n;i++)S+=(2*i+1)*(Math.log(z[i])+Math.log(1-z[n-1-i]));const A2=-n-S/n,A=A2*(1+0.75/n+2.25/(n*n));
  let p;if(A>=0.6)p=Math.exp(1.2937-5.709*A+0.0186*A*A);else if(A>=0.34)p=Math.exp(0.9177-4.279*A-1.38*A*A);else if(A>=0.2)p=1-Math.exp(-8.318+42.796*A-59.938*A*A);else p=1-Math.exp(-13.436+101.14*A-223.73*A*A);
  return{A2:A,p:Math.min(Math.max(p,0),1)}}
function linreg(y){const n=y.length,x=y.map((_,i)=>i+1),mx=ST.mean(x),my=ST.mean(y);let sxx=0,sxy=0;for(let i=0;i<n;i++){sxx+=(x[i]-mx)**2;sxy+=(x[i]-mx)*(y[i]-my)}
  const b=sxy/sxx,a=my-b*mx;let sse=0;for(let i=0;i<n;i++)sse+=(y[i]-a-b*x[i])**2;const se=Math.sqrt(sse/(n-2)/sxx);const t=b/se;return{a,b,t,p:n>2&&se>0?tTwoSided(t,n-2):1}}
const CONST={2:{A2:1.880,D3:0,D4:3.267,d2:1.128},3:{A2:1.023,D3:0,D4:2.574,d2:1.693},4:{A2:0.729,D3:0,D4:2.282,d2:2.059},5:{A2:0.577,D3:0,D4:2.114,d2:2.326}};

/* ================= storage ================= */
const DEF={minDesc:5,minECP:15,finalECP:30,minSPC:20,minCap:25,minSup:10,minTrend:20,
  ecp:[8,11,14,17],rules:'all',usl:'',fcuOv:'',lslOv:'',title:'',autoTypo:true,spreadPct:20,binW:''};
let S={reg:null,set:{...DEF},ov:{},filt:null,tab:'reg'};
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r){S={...S,...r};S.set={...DEF,...r.set};S.ov=r.ov||{}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({reg:S.reg,set:S.set,ov:S.ov,filt:S.filt,tab:S.tab}))}catch(e){toast('Could not save on this device. The analysis still works until you close the app.')}}

/* ================= reading files ================= */
async function readXlsx(buf){
  const zip=await JSZip.loadAsync(buf);const P=new DOMParser();
  const xml=async p=>{const f=zip.file(p);return f?P.parseFromString(await f.async('string'),'application/xml'):null};
  const wb=await xml('xl/workbook.xml');const rels=await xml('xl/_rels/workbook.xml.rels');
  const relMap={};if(rels)for(const r of rels.getElementsByTagName('Relationship'))relMap[r.getAttribute('Id')]=r.getAttribute('Target');
  const ssDoc=await xml('xl/sharedStrings.xml');const ss=[];
  if(ssDoc)for(const si of ssDoc.getElementsByTagName('si')){let t='';for(const x of si.getElementsByTagName('t'))t+=x.textContent;ss.push(t)}
  const sheets=[];
  for(const sh of wb.getElementsByTagName('sheet')){
    const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let tgt=relMap[rid]||'';tgt=tgt.startsWith('/')?tgt.slice(1):'xl/'+tgt.replace(/^\.\//,'');
    sheets.push({name:sh.getAttribute('name'),path:tgt})}
  const out={};
  for(const s of sheets){const doc=await xml(s.path);if(!doc)continue;const aoa=[];
    for(const row of doc.getElementsByTagName('row')){const ri=+row.getAttribute('r')-1;const arr=aoa[ri]=[];
      for(const c of row.getElementsByTagName('c')){const ref=c.getAttribute('r');let col=0;for(const ch of ref.match(/^[A-Z]+/)[0])col=col*26+ch.charCodeAt(0)-64;col--;
        const t=c.getAttribute('t');const v=c.getElementsByTagName('v')[0];let val='';
        if(t==='s')val=v?ss[+v.textContent]??'':'';
        else if(t==='inlineStr'){const is=c.getElementsByTagName('t');val=[...is].map(x=>x.textContent).join('')}
        else if(t==='str'||t==='e')val=v?v.textContent:'';
        else if(t==='b')val=v?v.textContent==='1':'';
        else val=v?Number(v.textContent):'';
        if(t==='e')val='';
        arr[col]=val}}
    for(let i=0;i<aoa.length;i++)if(!aoa[i])aoa[i]=[];
    out[s.name]=aoa}
  return{names:sheets.map(s=>s.name).filter(n=>out[n]),sheets:out}}
function readCsv(text){const rows=[];let row=[],f='',q=false;const delim=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',';
  for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===delim){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return{names:['CSV'],sheets:{CSV:rows.map(r=>r.map(v=>v!==''&&isFinite(+v)?+v:v))}}}

const pad=n=>String(n).padStart(2,'0');
function parseDate(v){
  if(v===''||v==null)return null;
  if(typeof v==='number'){if(v<20000||v>80000)return null;const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if((m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(m[2])+'-'+pad(m[1])}
  if((m=s.match(/^(\d{1,2})[- ]([A-Za-z]{3})[a-z]*[- ,]+(\d{2,4})/))){const mi='janfebmaraprmayjunjulaugsepoctnovdec'.indexOf(m[2].toLowerCase())/3;if(mi>=0){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(mi+1)+'-'+pad(m[1])}}
  return null}
const num=v=>{if(v===''||v==null||typeof v==='boolean')return null;const n=typeof v==='number'?v:parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:null};

/* ================= column matching ================= */
const FIELDS=[['id','Sample / Set ID',1],['pour','Date of pouring',1],['sup','Supplier / Plant'],['item','Item (PC, RC Raft…)'],['grade','Concrete grade'],['mix','Mix ID'],['cem','Cement type'],['el','Element / description'],
  ['c1','28-day cube 1',1],['c2','28-day cube 2'],['c3','28-day cube 3'],['avg','28-day average (register)']];
function guessMap(hdr){
  const L=hdr.map(h=>String(h).toLowerCase().replace(/\s+/g,' ').trim());const used=new Set();const m={};
  const find=(rx,from=0,to=L.length)=>{for(let i=Math.max(0,from);i<to;i++){if(used.has(i))continue;if(rx.test(L[i])){used.add(i);return i}}return -1};
  m.id=find(/sample|set ?#|set ?no|set id|cube ?(id|no)|specimen/);
  m.pour=find(/date of pour|pour(ing)? ?date|cast(ing)? ?date|date of cast|placing date/);if(m.pour<0)m.pour=find(/^date$/);
  m.sup=find(/supplier|plant|batching|producer|vendor|station name/);
  m.grade=find(/grade|strength class|concrete class/);
  m.mix=find(/mix/);
  m.cem=find(/cement/);
  m.item=find(/^items?$/);
  m.el=find(/exact item|element|description|structural/);
  let d28=L.findIndex(h=>/28/.test(h)&&/date/.test(h));
  let from=d28>=0?d28+1:L.findIndex(h=>/28/.test(h));
  if(from<0)from=0;
  m.c1=-1;m.c2=-1;m.c3=-1;m.avg=-1;

function trendChart(x,ids,A,w=640,h=240){

   ['Is plant performance improving or getting worse?',N<T.minTrend?'Not enough data yet.':`${A.trend[0].toUpperCase()+A.trend.slice(1)}: strength ${A.meanDir}, variability ${A.varDir==='same'?'unchanged':A.varDir}.`,{improving:'ok',steady:'na',deteriorating:'bad'}[A.trend]||'na']];
  h+=`<div class="qa">${ans.map(([q,a,c])=>`<div><span class="chip ${c}" style="min-width:12px">&nbsp;</span><b>${q}</b><span style="flex:2">${a}</span></div>`).join('')}</div>
   <p class="foot">Order of assessment: ECP 203-2020 (code assessment) → Process Stability → Process Capability → Six Sigma. Capability is relied on only after stability is confirmed. Generated by Concrete SPC on ${new Date().toISOString().slice(0,10)}.</p></section></div>`;
  return h}

/* ================= views ================= */
function vReg(){
  let h=`<div class="card"><h2>Load the concrete pouring register</h2><div class="drop" id="drop"><p style="margin:0 0 10px">Excel (.xlsx) or CSV. Any layout: you confirm the columns in the next step.</p>
    <button class="btn primary" id="pick">Choose register file</button></div>
    ${S.reg?`<p class="note">Loaded: <b>${esc(S.reg.file)}</b> · sheet ${esc(S.reg.sheet)} · ${S.reg.recs.length} samples · ${S.reg.recs.filter(hasResult).length} with 28-day results · read ${S.reg.loaded}</p>`:''}</div>`;
  if(pending){const p=pending;
    h+=`<div class="card"><h2>Match the columns</h2><div class="grid">
     <label class="f"><span>Sheet</span><select id="sheetSel">${p.book.names.map(n=>`<option ${n===p.sheet?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
     <label class="f"><span>Header row</span><input type="number" id="hdrRow" min="1" value="${p.hr+1}"></label>
     <label class="f" style="grid-column:span 2"><span>Project name (report title)</span><input type="text" id="ptitle" value="${esc(S.set.title||p.title)}"></label></div>
     <p class="note">Matches are filled in from the header. Check the 28-day cube columns: they must be the 28-day strengths, not the 7-day ones.</p>
     <div class="map">${FIELDS.map(([k,l,r])=>`<span class="${r?'req':''}">${l}</span><select id="m-${k}"><option value="-1">— not in this register —</option>${p.hdr.map((c,i)=>`<option value="${i}" ${p.map[k]===i?'selected':''}>${colName(i)} · ${esc(String(c).slice(0,40))||'(blank)'}</option>`).join('')}</select>`).join('')}</div>
     <div class="row"><button class="btn primary" id="doImport">Analyse this register</button><button class="btn" id="cancel">Cancel</button></div></div>`}
  if(S.reg&&!pending){const f=curFilt(),D=dataset(f);
    h+=`<div class="card"><h2>Samples in the selected group (${D.rows.length})</h2><p class="note">Tap a row to exclude it from the analysis or bring it back. Rows the app excluded automatically show the reason.</p>
    <div class="tw" style="max-height:60vh;overflow:auto"><table><thead><tr><th>#</th><th>Sample</th><th>Poured</th>${S.reg.mode==='cubes'?Array.from({length:S.reg.n},(_,i)=>`<th class="n">Cube ${i+1}</th>`).join(''):''}<th class="n">Result</th><th class="n">Range</th><th>Status</th></tr></thead><tbody>
    ${(()=>{let k=0;return D.rows.map(o=>`<tr class="${o.use?(o.flags.length?'flag':''):'out'}" data-id="${esc(o.id)}" style="cursor:pointer"><td>${o.use?++k:''}</td><td><b>${esc(o.id)}</b></td><td>${o.pour}</td>${S.reg.mode==='cubes'?o.c.map(v=>`<td class="n">${v??'–'}</td>`).join(''):''}<td class="n">${f1(o.x)}</td><td class="n">${o.R==null?'–':f1(o.R)}</td><td style="white-space:normal">${o.use?(o.flags.length?esc(o.flags.join('; ')):'✓'):esc(o.why)}</td></tr>`).join('')})()}
    </tbody></table></div></div>`}
  return h}
function vRep(){
  if(!S.reg)return`<div class="card"><h2>No register loaded</h2><p>Load the concrete pouring register from the Register tab to see the report.</p><button class="btn primary" id="pick">Choose register file</button></div>`;
  const f=curFilt(),T=S.set;const gs=groups();
  const opts=k=>{const vals=[...new Set(S.reg.recs.filter(hasResult).map(r=>r[k]))].sort();return`<option value="*" ${f[k]==='*'?'selected':''}>All</option>`+vals.map(v=>`<option ${f[k]===v?'selected':''} value="${esc(v)}">${esc(v||'(blank)')}</option>`).join('')};
  let h=`<div class="card noprint"><h2>Group to analyse</h2><div class="groups">${gs.slice(0,14).map((g,i)=>{const on=FK.every(k=>f[k]===g.f[k]);return`<button data-g="${i}" class="${on?'on':''}">${esc([g.f.sup,g.f.item,g.f.grade,g.f.mix].filter(Boolean).join(' · '))} <b>(${g.n})</b></button>`}).join('')}</div>
   <details style="margin-top:10px"><summary>Filters, limits and settings</summary>
   <div class="grid" style="margin-top:8px">${FK.map(k=>`<label class="f"><span>${FL[k]}</span><select id="f-${k}">${opts(k)}</select></label>`).join('')}
    <label class="f"><span>Poured from</span><input type="date" id="f-from" value="${f.from||''}"></label><label class="f"><span>Poured to</span><input type="date" id="f-to" value="${f.to||''}"></label></div>
   <div class="grid" style="margin-top:10px">
    <label class="f"><span>fcu (kg/cm²)</span><input type="number" id="s-fcuOv" placeholder="from grade: ${f1(fcuOf({...f})).replace('NaN','?')}" value="${T.fcuOv}"></label>
    <label class="f"><span>LSL (kg/cm²)</span><input type="number" id="s-lslOv" placeholder="= fcu" value="${T.lslOv}"></label>
    <label class="f"><span>USL (optional)</span><input type="number" id="s-usl" placeholder="none" value="${T.usl}"></label>
    <label class="f"><span>Histogram bin width</span><input type="number" id="s-binW" placeholder="auto" value="${T.binW}"></label>
    <label class="f"><span>Project name</span><input type="text" id="s-title" value="${esc(T.title||S.reg.title)}"></label></div>
   <h3>Minimum samples (Insufficient Data below these)</h3><div class="grid">
    ${[['minDesc','Any statistics'],['minECP','ECP assessment'],['finalECP','ECP final (else provisional)'],['minSPC','Control limits & stability'],['minCap','Capability & sigma'],['minTrend','Trend'],['minSup','Supplier row']].map(([k,l])=>`<label class="f"><span>${l}</span><input type="number" min="2" id="s-${k}" value="${T[k]}"></label>`).join('')}</div>
   <h3>ECP 203-2020 Table (8-3) CV limits, %</h3><div class="grid">${['Excellent below','Very good below','Good below','Acceptable up to'].map((l,i)=>`<label class="f"><span>${l}</span><input type="number" step="0.5" id="s-ecp${i}" value="${T.ecp[i]}"></label>`).join('')}</div>
   <p class="note">Defaults: &lt;8 Excellent, 8–11 Very Good, 11–14 Good, 14–17 Acceptable, &gt;17 Poor. Check them against your approved copy of the code.</p>
   <h3>Stability rules</h3><div class="grid"><label class="f"><span>Out-of-control tests on the X̄ chart</span><select id="s-rules"><option value="all" ${T.rules==='all'?'selected':''}>Western Electric / Nelson 1, 2, 3, 5, 6</option><option value="r1" ${T.rules==='r1'?'selected':''}>Rule 1 only (points beyond 3σ)</option></select></label></div>
   <h3>Data checks</h3><div class="grid"><label class="f"><span>Auto-exclude mistyped cubes (&lt;30% or &gt;300% of fcu)</span><select id="s-autoTypo"><option value="1" ${T.autoTypo?'selected':''}>On</option><option value="0" ${T.autoTypo?'':'selected'}>Off</option></select></label>
    <label class="f"><span>Flag set range above (% of mean)</span><input type="number" id="s-spreadPct" value="${T.spreadPct}"></label></div>
   <div class="row" style="margin-top:10px"><button class="btn" id="resetSet">Reset settings</button>${Object.keys(S.ov).length?`<button class="btn" id="resetOv">Clear my ${Object.keys(S.ov).length} include/exclude choices</button>`:''}</div></details>
   <div class="row" style="margin-top:12px"><button class="btn primary" id="pdf">${NATIVE&&window.AndroidBridge.platform==='desktop'?'Save report as PDF':NATIVE?'Save / print PDF':'Print / save PDF'}</button><button class="btn" id="pick">Load another register</button></div></div>`;
  return h+report()}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  $('#app').innerHTML=S.tab==='reg'?vReg():vRep();
  $('#hdrSub').textContent=S.reg?(S.set.title||S.reg.title||S.reg.file):'28-day cube strength analysis · ECP 203-2020';
  bind()}
function bind(){
  const pick=$('#pick');if(pick)pick.onclick=()=>$('#file').click();
  const dr=$('#drop');if(dr){dr.ondragover=e=>{e.preventDefault();dr.classList.add('over')};dr.ondragleave=()=>dr.classList.remove('over');dr.ondrop=e=>{e.preventDefault();dr.classList.remove('over');if(e.dataTransfer.files[0])onFile(e.dataTransfer.files[0])}}
  if(pending){$('#sheetSel').onchange=e=>{prep(e.target.value);render()};$('#hdrRow').onchange=e=>{prep(pending.sheet,Math.max(0,+e.target.value-1));render()};
    $('#doImport').onclick=doImport;$('#cancel').onclick=()=>{pending=null;render()}}
  document.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{const id=tr.dataset.id;const D=dataset(curFilt());const o=D.rows.find(z=>z.id===id);if(!o)return;
    if(o.use)S.ov[id]='out';else if(S.ov[id]==='out')delete S.ov[id];else{if(o.R==null&&S.reg.mode==='cubes'){toast('This set is incomplete and can\'t be analysed.');return}S.ov[id]='in'}
    save();render();toast(S.ov[id]==='out'?`${id} excluded`:`${id} included`)});
  document.querySelectorAll('.groups button').forEach(b=>b.onclick=()=>{const g=groups()[+b.dataset.g];S.filt={...g.f,from:S.filt?.from||'',to:S.filt?.to||''};S.set.fcuOv='';save();render()});
  FK.forEach(k=>{const e=$('#f-'+k);if(e)e.onchange=()=>{S.filt[k]=e.value;if(k==='grade')S.set.fcuOv='';save();render()}});
  ['from','to'].forEach(k=>{const e=$('#f-'+k);if(e)e.onchange=()=>{S.filt[k]=e.value;save();render()}});
  ['fcuOv','lslOv','usl','binW','title','minDesc','minECP','finalECP','minSPC','minCap','minTrend','minSup','spreadPct'].forEach(k=>{const e=$('#s-'+k);if(e)e.onchange=()=>{const v=e.value.trim();S.set[k]=['fcuOv','lslOv','usl','binW','title'].includes(k)?v:Math.max(2,+v||DEF[k]);save();render();reopen()}});
  [0,1,2,3].forEach(i=>{const e=$('#s-ecp'+i);if(e)e.onchange=()=>{S.set.ecp[i]=+e.value||DEF.ecp[i];save();render();reopen()}});
  const rl=$('#s-rules');if(rl)rl.onchange=()=>{S.set.rules=rl.value;save();render();reopen()};
  const at=$('#s-autoTypo');if(at)at.onchange=()=>{S.set.autoTypo=at.value==='1';save();render();reopen()};
  const rs=$('#resetSet');if(rs)rs.onclick=()=>{S.set={...DEF,ecp:[...DEF.ecp],title:S.set.title};save();render();reopen();toast('Settings reset')};
  const ro=$('#resetOv');if(ro)ro.onclick=()=>{S.ov={};save();render();reopen()};
  const pdf=$('#pdf');if(pdf)pdf.onclick=savePdf}
function reopen(){const d=document.querySelector('details');if(d)d.open=true}
function savePdf(){
  const f=curFilt();const name=`Concrete SPC - ${[f.sup,f.item,f.grade,f.mix].filter(v=>v&&v!=='*').join(' ')} - ${new Date().toISOString().slice(0,10)}`.replace(/[\\/:*?"<>|]/g,'_');
  document.title=name;
  if(window.AndroidBridge&&window.AndroidBridge.printPdf){window.AndroidBridge.printPdf(name);setTimeout(()=>document.title='Concrete SPC',3000);return}
  window.print();setTimeout(()=>document.title='Concrete SPC',3000)}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();render();scrollTo(0,0)});
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)onFile(f)};
load();if(!S.reg)S.tab='reg';render();
</script>
</body>
</html>
