name: Build Concrete SPC for Windows

on:
  push:
    branches: [main]
    paths:
      - "cube-spc/web/**"
      - "cube-spc/desktop/**"
      - ".github/workflows/concrete-spc-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Use the same app page as the Android version
        run: |
          mkdir -p cube-spc/desktop/app
          cp cube-spc/web/index.html cube-spc/web/jszip.min.js cube-spc/desktop/app/

      - name: Install
        working-directory: cube-spc/desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: cube-spc/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --x64 --publish never

      - name: Publish the installer as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete concrete-spc-desktop-latest --yes --cleanup-tag || true
          gh release create concrete-spc-desktop-latest "cube-spc/desktop/dist/Concrete-SPC-Setup.exe" \
            --title "Concrete SPC for Windows (build ${{ github.run_number }})" \
            --notes "Download Concrete-SPC-Setup.exe and open it. If Windows shows 'Windows protected your PC', click More info, then Run anyway. Developed by Eng. Ahmed Rabie" \
            --latest=false
