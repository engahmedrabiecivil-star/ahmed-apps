name: Build IR Maker for Windows

on:
  push:
    branches: [main]
    paths:
      - "ir-maker/**"
      - ".github/workflows/ir-maker-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Use the same app page as the Android version
        run: cp ir-maker/android/app/src/main/assets/index.html ir-maker/desktop/index.html

      - name: Install
        working-directory: ir-maker/desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: ir-maker/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --x64 --publish never

      - name: Publish the installer as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ir-maker-desktop-latest --yes --cleanup-tag || true
          gh release create ir-maker-desktop-latest "ir-maker/desktop/dist/IR-Maker-Setup.exe" \
            --title "IR Maker for Windows (build ${{ github.run_number }})" \
            --notes "Download IR-Maker-Setup.exe and open it. If Windows shows 'Windows protected your PC', click More info, then Run anyway. Developed by Eng. Ahmed Rabie" \
            --latest=false
