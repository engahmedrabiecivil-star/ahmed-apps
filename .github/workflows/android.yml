name: Build Cube Crush Alert APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "cube-crush-alert/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Put the web app inside the APK (works offline)
        run: |
          mkdir -p android/app/src/main/assets/www
          cp cube-crush-alert/index.html android/app/src/main/assets/www/index.html
          curl -fsSL -o android/app/src/main/assets/www/xlsx.full.min.js https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#xlsx.full.min.js#' android/app/src/main/assets/www/index.html
          grep -q 'src="xlsx.full.min.js"' android/app/src/main/assets/www/index.html

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk CubeCrushAlert.apk
          gh release delete cube-crush-latest --yes --cleanup-tag || true
          gh release create cube-crush-latest CubeCrushAlert.apk \
            --title "Cube Crush Alert for Android (build ${{ github.run_number }})" \
            --notes "Download CubeCrushAlert.apk on your Android phone and open it to install. Allow 'Install unknown apps' when asked." \
            --latest
