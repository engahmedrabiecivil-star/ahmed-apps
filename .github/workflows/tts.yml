name: Make narration (temporary)

on:
  push:
    branches: [video-tts]
    paths: ["tts/**", ".github/workflows/tts.yml"]

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Voice each scene
        run: |
          pip install --quiet edge-tts==7.0.2
          python - <<'PY'
          import json, asyncio, edge_tts
          sc = json.load(open("tts/script.json", encoding="utf-8"))
          async def go():
              for s in sc:
                  for voice in ["ar-EG-ShakirNeural", "ar-EG-SalmaNeural"]:
                      c = edge_tts.Communicate(s["say"], voice, rate="+4%")
                      await c.save(f"out/{voice[:5]}_{voice[6:11]}_{s['id']}.mp3")
          import os; os.makedirs("out", exist_ok=True)
          asyncio.run(go())
          PY
          ls -la out | head
      - uses: actions/upload-artifact@v4
        with:
          name: narration
          path: out/
