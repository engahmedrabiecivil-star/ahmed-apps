<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5fa8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cube Crush">
<title>Cube Crush Alert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: one-column site tool — status band, tab bar, views; full-screen alarm overlay */
:root{
  --bg:#eef0f1; --surface:#ffffff; --sunk:#e3e6e8; --line:#cfd4d8;
  --fg:#1c2226; --muted:#5e686f; --accent:#1d5fa8; --accent-fg:#ffffff;
  --siren:#c62828; --siren-soft:#fbe4e2; --ok:#2e7d4f; --ok-soft:#e0f1e6; --warn:#a86a00; --warn-soft:#fbefd6;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141819; --surface:#1d2224; --sunk:#262c2f; --line:#353d41;
  --fg:#e7eaec; --muted:#9aa4aa; --accent:#6ea6e6; --accent-fg:#0e1a26;
  --siren:#ff6b5e; --siren-soft:#3a1d1b; --ok:#6fcf97; --ok-soft:#1b3326; --warn:#f0b54d; --warn-soft:#3a2e15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141819; --surface:#1d2224; --sunk:#262c2f; --line:#353d41;
  --fg:#e7eaec; --muted:#9aa4aa; --accent:#6ea6e6; --accent-fg:#0e1a26;
  --siren:#ff6b5e; --siren-soft:#3a1d1b; --ok:#6fcf97; --ok-soft:#1b3326; --warn:#f0b54d; --warn-soft:#3a2e15; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1}
h2{font-size:22px}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.topr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-inline-start:auto}
.credit{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.02em;color:var(--accent);text-align:end;line-height:1.1}
.top .sub{font-size:13px;color:var(--muted)}
select,input,button{font:inherit;color:inherit}
select,input[type=time],input[type=number],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;max-width:100%}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;min-height:42px;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.danger{background:var(--siren);color:#fff;border-color:var(--siren)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.status .txt{flex:1;min-width:0}
.status .big{font-family:var(--display);font-size:20px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.armed .dot{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs button{border:0;background:transparent;min-height:38px;padding:6px 4px;font-size:14px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:start;font-weight:400}
.tile .n{font-family:var(--display);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile.over .n{color:var(--siren)}
.tile[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunk);white-space:nowrap}
.chip.a7{background:var(--warn-soft);color:var(--warn)}
.chip.a28{background:var(--ok-soft);color:var(--ok)}
.chip.ax{background:var(--sunk);color:var(--accent)}
.chip.late{background:var(--siren-soft);color:var(--siren)}
.set{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.set.late{border-inline-start:4px solid var(--siren)}
.set.done{opacity:.55}
.set .id{font-family:var(--mono);font-size:16px;font-weight:500}
.set .meta{grid-column:2/4;font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.set input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok);grid-row:1/3}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.grid7 .dn{font-size:11px;text-align:center;color:var(--muted);text-transform:uppercase}
.day{aspect-ratio:1/1;max-width:100%;border:1px solid transparent;border-radius:8px;background:var(--bg);padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:13px;min-height:0;font-weight:500}
.day.off{opacity:.45}
.day.today{border-color:var(--accent)}
.day.sel{background:var(--accent);color:var(--accent-fg)}
.day .c{font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;background:var(--warn-soft);color:var(--warn)}
.day .c.has28{background:var(--ok-soft);color:var(--ok)}
.day.sel .c{background:var(--accent-fg);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row label{flex:1;min-width:150px}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:13px;color:var(--muted)}
.map{display:grid;grid-template-columns:1fr 1.4fr;gap:8px 10px;align-items:center}
.map .req::after{content:" *";color:var(--siren)}
.report{font-size:13px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{position:sticky;top:0;background:var(--sunk);font-weight:600}
.note a{color:var(--accent);font-weight:600}
.note{font-size:13px;color:var(--muted);border-inline-start:3px solid var(--warn);padding-inline-start:10px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;background:var(--bg)}
/* alarm overlay */
.alarm{position:fixed;inset:0;z-index:50;background:var(--siren);color:#fff;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));gap:14px;overflow:auto}
.alarm .flash{font-family:var(--display);font-size:44px;line-height:1;font-weight:700;text-transform:uppercase}
.alarm .when{opacity:.85}
.alarm .list{background:rgba(0,0,0,.22);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.alarm .ids{font-family:var(--mono);font-size:18px;line-height:1.6;overflow-wrap:anywhere}
.alarm .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alarm button{min-height:60px;font-size:18px;border:0}
.alarm .dismiss{background:#fff;color:#8a1414}
.alarm .snooze{background:rgba(0,0,0,.3);color:#fff}
@media (prefers-reduced-motion:no-preference){.alarm.ringing{animation:pulse 1s steps(2) infinite}}
@keyframes pulse{50%{background:#7f1010}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
@media (max-width:480px){h1{font-size:26px}.tile .n{font-size:26px}.map{grid-template-columns:1fr}.alarm .flash{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>Cube Crush Alert</h1><div class="sub" id="projName"></div></div>
    <div class="topr"><div class="credit">Developed by Eng Ahmed Rabie</div>
    <select id="projSel" aria-label="Project"></select></div>
  </header>

  <section class="status" id="status">
    <span class="dot"></span>
    <div class="txt"><div class="big" id="stBig">Alarm not armed</div><div class="muted" id="stSmall"></div></div>
    <button class="primary" id="armBtn">Arm alarm</button>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-v="today" aria-selected="true">Crushing</button>
    <button role="tab" data-v="cal" aria-selected="false">Calendar</button>
    <button role="tab" data-v="reg" aria-selected="false">Register</button>
    <button role="tab" data-v="set" aria-selected="false">Alarm settings</button>
  </nav>

  <main id="view"></main>
</div>

<div class="alarm" id="alarm" hidden role="alertdialog" aria-labelledby="alTitle">
  <div class="flash" id="alTitle">Cube crushing</div>
  <div class="when" id="alWhen"></div>
  <div class="list" id="alList"></div>
  <div class="btns"><button class="snooze" id="alSnooze">Snooze</button><button class="dismiss" id="alDismiss">Dismiss</button></div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
// Example sets dated around today so the app shows real behaviour on first open
const SAMPLE=(()=>{const t=new Date(),ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 const back=n=>{const d=new Date(t);d.setDate(d.getDate()-n);return ymd(d)};
 const rows=[[35,'Blinding below waterproofing','C20'],[29,'Plain raft 60 cm','C20'],[28,'Reinforced raft','C35'],[28,'Reinforced raft','C35'],[27,'Wall','C35'],[8,'Blinding above waterproofing','C20'],[7,'Reinforced raft','C35'],[7,'Reinforced raft','C35'],[7,'Wall','C35'],[6,'Haunch','C20'],[3,'Reinforced raft','C35'],[1,'Wall','C35']];
 return rows.map((r,i)=>['EX-'+(i+1),'Pour card '+String(i+1).padStart(3,'0'),r[1],String(i%5+1),r[2],back(r[0]),null,null,r[0]>7?1:0,r[0]>28?1:0])})();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='cca1';
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* ---------- dates (UTC-based YYYY-MM-DD strings) ---------- */
const pad=n=>String(n).padStart(2,'0');
const todayYmd=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const toUTC=y=>{const[a,b,c]=y.split('-').map(Number);return Date.UTC(a,b-1,c)};
const fromUTC=t=>{const d=new Date(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const addD=(y,n)=>fromUTC(toUTC(y)+n*864e5);
const dow=y=>new Date(toUTC(y)).getUTCDay();
const nice=y=>{const d=new Date(toUTC(y));return DN[d.getUTCDay()]+' '+d.getUTCDate()+' '+MN[d.getUTCMonth()]};
function parseDate(v){
  if(v==null||v==='')return null;
  if(typeof v==='number'){if(v<20000||v>80000)return null;return fromUTC(Date.UTC(1899,11,30)+Math.round(v)*864e5)}
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  const s=String(v).trim();let m;
  if(/^\d{5}(\.\d+)?$/.test(s))return parseDate(Number(s));
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/)){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(m[2])+'-'+pad(m[1])}
  if(m=s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[A-Za-z]*[-\s,]+(\d{2,4})$/)){const mi=MN.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mi<0)return null;let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(mi+1)+'-'+pad(m[1])}
  return null;
}
/* ---------- state ---------- */
const DEF_SET={t7:'07:30',t28:'07:30',eve:true,eveTime:'20:00',snooze:10,sound:'siren',vol:0.9,ring:60,offDays:[5],shift:'none',extra:''};
let S={projects:[],active:0,marks:{},fired:{},settings:{...DEF_SET}};
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.projects){S=r;S.settings={...DEF_SET,...r.settings};S.fired=S.fired||{}}}catch(e){}
  if(!S.projects.length){S.projects=[{name:'Example project',src:'Example data · import your register from the Register tab',sets:SAMPLE.map(r=>({id:r[0],card:r[1],el:r[2],loc:r[3],grade:r[4],pour:r[5],d7:r[6],d28:r[7],r7:!!r[8],r28:!!r[9]}))}]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncNative()}
let customSound=null;try{customSound=localStorage.getItem(KEY+'snd')}catch(e){}
const proj=()=>S.projects[S.active]||S.projects[0];
/* ---------- schedule ---------- */
function ages(){return [7,28,...String(S.settings.extra).split(/[ ,]+/).map(Number).filter(n=>n>0&&n!==7&&n!==28)].sort((a,b)=>a-b)}
function shiftDay(y){const st=S.settings;if(st.shift==='none')return y;let g=0;while(st.offDays.includes(dow(y))&&g++<7)y=addD(y,st.shift==='next'?1:-1);return y}
function tests(p=proj()){
  const out=[];
  for(const s of p.sets){for(const a of ages()){
    let d=a===7&&s.d7?s.d7:a===28&&s.d28?s.d28:addD(s.pour,a);
    const orig=d;d=shiftDay(d);
    const res=a===7?s.r7:a===28?s.r28:false;
    const mk=!!S.marks[p.name+'|'+s.id+'|'+a];
    out.push({s,a,d,orig,done:res||mk,fromReg:res,mk});
  }}
  return out;
}
function bucket(){const t=todayYmd(),tm=addD(t,1),all=tests();
  return{all,today:all.filter(x=>x.d===t),tomorrow:all.filter(x=>x.d===tm),over:all.filter(x=>x.d<t&&!x.done&&x.d>=addD(t,-60))}}
/* ---------- alarm engine ---------- */
function evFor(p,pi,days){
  const st=S.settings,t=todayYmd(),all=tests(p),ev=[],by={};
  for(const x of all){if(x.done||x.d<t)continue;(by[x.d]=by[x.d]||[]).push(x)}
  const over=all.filter(x=>x.d<t&&!x.done&&x.d>=addD(t,-60));
  const pend=(arr,a)=>arr.filter(x=>a===28?x.a===28:x.a!==28);
  const mk=(day,time,kind,items,forDay)=>{if(!items.length)return;const[h,m]=time.split(':').map(Number);const[y,mo,d]=day.split('-').map(Number);ev.push({key:pi+'|'+day+'|'+kind,at:new Date(y,mo-1,d,h,m).getTime(),kind,day:forDay||day,items,proj:p.name})};
  for(let i=0;i<=days;i++){const day=addD(t,i),list=(by[day]||[]).concat(i===0?over:[]);
    if(st.t7===st.t28)mk(day,st.t7,'main',list);else{mk(day,st.t7,'7',pend(list,7));mk(day,st.t28,'28',pend(list,28))}
    if(st.eve&&i<days)mk(day,st.eveTime,'eve',by[addD(day,1)]||[],addD(day,1))}
  return ev;
}
function events(days=1){let ev=[];S.projects.forEach((p,i)=>{ev=ev.concat(evFor(p,i,days))});if(snoozeEv)ev.push(snoozeEv);return ev.sort((a,b)=>a.at-b.at)}
/* ---------- native Android bridge ---------- */
const NATIVE=!!window.Android;
const APK_URL=(()=>{const h=location.hostname,r=location.pathname.split('/')[1];return h.endsWith('.github.io')&&r?'https://github.com/'+h.split('.')[0]+'/'+r+'/releases/download/cube-crush-latest/CubeCrushAlert.apk':'https://github.com/engahmedrabiecivil-star/ahmed-apps/releases/download/cube-crush-latest/CubeCrushAlert.apk'})();
function hashId(k){let h=7;for(const c of k)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%1000000+1000}
function evText(e){const g={};for(const x of e.items)(g[x.a]=g[x.a]||[]).push(x.s.id+(x.d<todayYmd()?' (late)':''));return Object.keys(g).sort((a,b)=>a-b).map(a=>a+'-day: '+g[a].join(', ')).join('\n')}
function evTitle(e){return (e.kind==='eve'?'Crushing tomorrow':'Crush cubes now')+' · '+e.proj}
function syncNative(){if(!NATIVE)return;try{
  const now=Date.now(),list=events(60).filter(e=>e.at>now&&e.kind!=='snooze').slice(0,300).map(e=>({id:hashId(e.key),at:e.at,title:evTitle(e),body:nice(e.day)+' · '+e.items.length+' sets\n'+evText(e)}));
  Android.setPrefs(JSON.stringify({ring:S.settings.ring,vol:S.settings.vol,snooze:S.settings.snooze}));
  Android.schedule(JSON.stringify(list));
}catch(err){}}
function perms(){if(!NATIVE)return null;try{return JSON.parse(Android.permissions())}catch(e){return null}}
window.onNativeResume=()=>{syncNative();render()};
let armed=false,snoozeEv=null,ringing=null,wake=null,actx=null,sirenNodes=[],audioEl=null,stopTimer=null;
function tick(){
  if(NATIVE){status();return}
  const now=Date.now();
  for(const e of events()){if(e.at<=now&&e.at>now-30*60e3&&!S.fired[e.key]){S.fired[e.key]=1;
    if(e.kind==='snooze')snoozeEv=null;save();ring(e);break}}
  status();
}
function status(){
  if(NATIVE){const n=events(60).filter(e=>e.at>Date.now())[0];$('#status').classList.add('armed');
    $('#stBig').textContent=n?'Alarm set · '+fmtAt(n.at):'No crushing scheduled';
    $('#stSmall').textContent=n?n.items.length+' sample sets · '+(n.kind==='eve'?'evening reminder · ':'')+'rings even with the app closed':'Import a register to set the alarms.';
    $('#armBtn').textContent='Test alarm';return}
  const ev=events().filter(e=>e.at>Date.now()&&!S.fired[e.key]);const n=ev[0];
  $('#status').classList.toggle('armed',armed);
  $('#stBig').textContent=armed?(n?'Armed · next '+fmtAt(n.at):'Armed · nothing due'):'Alarm not armed';
  $('#stSmall').textContent=n?(n.items.length+' sample sets'+(n.kind==='eve'?' (evening reminder for '+nice(n.day)+')':'')+(armed?'':' · tap Arm and keep this page open')):(armed?'Keep this page open; the screen stays on.':'Tap Arm so the siren can play, then keep this page open.');
  $('#armBtn').textContent=armed?'Test siren':'Arm alarm';
}

  bindMarks();
  document.querySelectorAll('[data-perm]').forEach(b=>b.onclick=()=>Android.fix(b.dataset.perm));
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{filter=t.dataset.f;render()});
  const cb=$('#copyBtn');if(cb)cb.onclick=()=>{const b=bucket();const items=view==='cal'?tests().filter(x=>x.d===calSel):filter==='over'?b.over:b[filter];const txt=copyText(items,view==='cal'?nice(calSel):filter==='over'?'overdue':nice(filter==='today'?todayYmd():addD(todayYmd(),1)));
    if(NATIVE){Android.copy(txt);toast('List copied');return}navigator.clipboard.writeText(txt).then(()=>toast('List copied'),()=>toast('Copy blocked here'))};
  if(view==='cal'){document.querySelectorAll('.day').forEach(d=>d.onclick=()=>{calSel=d.dataset.d;render()});
    $('#pm').onclick=()=>{const[y,m]=calMonth.split('-').map(Number);calMonth=m===1?(y-1)+'-12-01':y+'-'+pad(m-1)+'-01';render()};
    $('#nm').onclick=()=>{const[y,m]=calMonth.split('-').map(Number);calMonth=m===12?(y+1)+'-01-01':y+'-'+pad(m+1)+'-01';render()}}
  if(view==='reg'){$('#file').onchange=e=>e.target.files[0]&&onFile(e.target.files[0]);
    if(pending){$('#sheetSel').onchange=e=>{prep(e.target.value);render()};$('#hdrRow').onchange=e=>{prep(pending.sheet,Math.max(0,+e.target.value-1));render()};$('#doImport').onclick=doImport;$('#cancelImp').onclick=()=>{pending=null;render()}}
    const dp=$('#delProj');if(dp)dp.onclick=()=>{if(dp.dataset.c){S.projects.splice(S.active,1);S.active=0;save();render()}else{dp.dataset.c=1;dp.textContent='Tap again to remove';dp.classList.add('danger')}}}
  if(view==='set')bindSettings();
  status();
}
load();render();if(NATIVE){if(customSound&&S.settings.sound==='custom')Android.setSound(customSound);syncNative()}setInterval(tick,10000);tick();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
